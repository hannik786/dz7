<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="main.js"></script>
    <header>
        <h1>Мій магазин</h1>
        <button id="dark-mode">Dark mode</button>
    </header>
    <main>
        <section>
            <h2>Товари</h2>
            <input
                type="text"
                id="search"
                placeholder="Пошук товарів..."
            >
            <div id="products" class="products"></div>
            <p id="no-products" hidden>Товари не знайдено.</p>
        </section>
        <section class="cart-section">
            <h2>Кошик</h2>
            <p>Кількість товарів: <span id="cart-count">0</span></p>
            <p>Загальна сума: <span id="cart-total">0</span> $</p>
            <ul id="cart-list"></ul>
            <button id="empty-cart">Очистити кошик</button>
        </section>
    </main>
</body>
</html>
